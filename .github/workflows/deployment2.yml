name: Deployment Exercise 2
on: push
defaults:
  run:
    working-directory: exercise
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: npm ci

      - name: Test Code
        run: npm run test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: npm ci

      - name: Build Code
        run: npm run build

      - name: Deploying Code
        run: echo "Deploying Code ..."
