name: Deployment Exercise 1
on: push
defaults:
  run:
    working-directory: exercise
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test Code
        run: npm run test

      - name: Build Code
        run: npm run build

      - name: Deploying Code
        run: echo "Deploying Code ..."
